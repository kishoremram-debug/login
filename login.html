<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{min-height:100vh;display:flex;justify-content:center;align-items:center;overflow:hidden;background:linear-gradient(135deg,#0f0c29,#302b63,#24243e)}
.circle{position:absolute;border-radius:50%;filter:blur(2px);animation:float 8s infinite ease-in-out}
.circle:nth-child(1){width:250px;height:250px;background:rgba(0,255,255,.18);top:-80px;left:-80px}
.circle:nth-child(2){width:300px;height:300px;background:rgba(150,0,255,.2);bottom:-120px;right:-100px;animation-delay:2s}
.circle:nth-child(3){width:150px;height:150px;background:rgba(255,0,150,.15);top:40%;right:15%;animation-delay:4s}
@keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(30px,-40px)}}
.card{position:relative;width:390px;max-width:92%;padding:38px;border-radius:25px;background:rgba(255,255,255,.08);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.2);box-shadow:0 25px 60px rgba(0,0,0,.45);animation:appear .8s ease}
@keyframes appear{from{opacity:0;transform:translateY(35px) scale(.95)}to{opacity:1;transform:none}}
h1{text-align:center;color:white;margin-bottom:8px;font-size:32px}.subtitle{text-align:center;color:rgba(255,255,255,.65);margin-bottom:28px;font-size:14px}
.input{position:relative;margin-bottom:18px}.input input{width:100%;padding:15px;border:1px solid rgba(255,255,255,.15);outline:none;border-radius:12px;background:rgba(255,255,255,.1);color:white;font-size:15px;transition:.3s}.input input::placeholder{color:rgba(255,255,255,.5)}.input input:focus{border-color:#00eaff;box-shadow:0 0 15px rgba(0,234,255,.25)}
.password-wrap input{padding-right:50px}.eye{position:absolute;right:15px;top:50%;transform:translateY(-50%);cursor:pointer;color:white;user-select:none;font-size:18px}
.options{display:flex;justify-content:space-between;align-items:center;margin:5px 0 22px;color:rgba(255,255,255,.7);font-size:13px}.remember{display:flex;align-items:center;gap:7px}.remember input{accent-color:#00eaff}.forgot{color:#00eaff;text-decoration:none}.forgot:hover{text-decoration:underline}
button{width:100%;padding:15px;border:0;border-radius:12px;background:linear-gradient(90deg,#00eaff,#8a2be2);color:white;font-size:16px;font-weight:bold;cursor:pointer;transition:.3s}button:hover{transform:translateY(-3px);box-shadow:0 10px 30px rgba(0,234,255,.3)}button:active{transform:scale(.97)}
.register{text-align:center;color:rgba(255,255,255,.65);font-size:13px;margin-top:22px}.register a{color:#00eaff;text-decoration:none}.register a:hover{text-decoration:underline}
#message{text-align:center;margin-top:17px;min-height:20px;font-size:14px}.success{color:#00ffae;animation:pop .4s ease}.error{color:#ff6680}@keyframes pop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}
@media(max-width:450px){.card{padding:30px 23px}}
</style>
</head>
<body>
<div class="circle"></div><div class="circle"></div><div class="circle"></div>
<div class="card">
<h1>Welcome Back</h1><p class="subtitle">Login to continue to your account</p>
<form id="loginForm">
<div class="input"><input id="username" type="text" placeholder="Username or Email" required></div>
<div class="input password-wrap"><input id="password" type="password" placeholder="Password" required><span class="eye" onclick="togglePassword()">👁️</span></div>
<div class="options"><label class="remember"><input id="remember" type="checkbox"> Remember me</label><a class="forgot" href="#" onclick="forgotPassword(event)">Forgot password?</a></div>
<button type="submit">Login</button>
</form>
<div id="message"></div>
<p class="register">Don't have an account? <a href="registration.html">Create account</a></p>
</div>
<script>
const form=document.getElementById("loginForm"),username=document.getElementById("username"),message=document.getElementById("message");
const savedUsername=localStorage.getItem("savedUsername");
if(savedUsername){username.value=savedUsername;document.getElementById("remember").checked=true;}
function togglePassword(){const p=document.getElementById("password");p.type=p.type==="password"?"text":"password";}
form.addEventListener("submit",function(e){e.preventDefault();const name=username.value.trim(),password=document.getElementById("password").value,remember=document.getElementById("remember").checked;if(!name||!password){message.textContent="✕ Please fill in all fields.";message.className="error";return;}if(remember)localStorage.setItem("savedUsername",name);else localStorage.removeItem("savedUsername");message.textContent="✓ Login details saved!";message.className="success";});
function forgotPassword(e){e.preventDefault();message.textContent="Password reset would be handled by your server.";message.className="success";}
</script>
</body>
</html>
